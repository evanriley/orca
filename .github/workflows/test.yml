name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop -c zig build
      - run: nix develop -c scripts/headless-audio.sh zig build test
      - run: nix develop -c zig build fuzz

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop -c zig fmt --check liborca apps benchmarks tests build build.zig

  pinact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run --inputs-from . nixpkgs#pinact -- run --check --verify

  cross-macos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop -c zig build lib -Dtarget=aarch64-macos

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: orca
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}
      - run: nix flake check -L

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop -c zig build package-check

  distro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            install: >-
              apt-get update &&
              apt-get install --no-install-recommends -y
              ca-certificates xz-utils pkg-config libsqlite3-dev libflac-dev
              libogg-dev libvorbis-dev libopus-dev libopusfile-dev
              libsamplerate0-dev libpipewire-0.3-dev
              pipewire pipewire-bin wireplumber python3 binutils procps
            flags: -Dgtk=false
          - image: fedora:43
            install: >-
              dnf install -y
              tar xz pkgconf-pkg-config sqlite-devel flac-devel libogg-devel
              libvorbis-devel opus-devel opusfile-devel libsamplerate-devel
              pipewire-devel gtk4-devel libadwaita-devel libsecret-devel
              pipewire pipewire-utils wireplumber python3 binutils procps-ng
            flags: ""
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - run: ${{ matrix.install }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - run: zig build ${{ matrix.flags }}
      - run: scripts/headless-audio.sh zig build test ${{ matrix.flags }}

  required:
    if: always()
    needs: [test, fmt, pinact, cross-macos, nix, package, distro]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success")' <<<"$RESULTS"
